name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # main.tsx constructs the Convex client at module scope with no fallback,
      # and ConvexReactClient throws on an invalid address — so a missing value
      # renders a blank page rather than failing the build. The build step below
      # falls back to this project's own deployment, so this is only a notice.
      - name: Resolve build configuration
        env:
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
        run: |
          if [ -z "$VITE_CONVEX_URL" ]; then
            echo "::notice::Repository variable VITE_CONVEX_URL is not set. Using the project's default Convex deployment. Set it under Settings -> Secrets and variables -> Actions -> Variables to point the site at a production deployment."
          else
            echo "Using VITE_CONVEX_URL from repository variables."
          fi

      - run: bunx tsc -b

      - uses: actions/configure-pages@v5

      # /food-rescue/ is required: this is a project page served from a
      # subpath, so Vite's default base of "/" would 404 every asset.
      # Change to "/" if you ever attach a custom domain.
      - name: Build
        run: bunx vite build --base=/food-rescue/
        env:
          # The repository variable wins when set; the literal is this project's
          # Convex deployment and is public client configuration either way
          # (the value ships inside the browser bundle).
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://quiet-salamander-408.convex.cloud' }}

      # GitHub Pages has no rewrite rules, so ship index.html as 404.html or
      # any deep link (e.g. /food-rescue/rescue) returns the Pages 404.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
